<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Lab · 看见并发</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:var(--color-text-primary,#202a2e);background:var(--color-background-primary,#fff)}
*{box-sizing:border-box}body{margin:0;padding:clamp(18px,4vw,32px)}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.eyebrow{font-size:11px;letter-spacing:.12em;color:#0d9488;font-weight:650}h1{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:10px 0}p{color:var(--color-text-secondary,#63747a);font-size:13px;line-height:1.7;margin:0}.tag{white-space:nowrap;border:1px solid var(--color-border-tertiary,#dbe2e5);border-radius:20px;padding:5px 10px;font-size:11px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:26px 0}.metric{border-bottom:2px solid var(--color-border-tertiary,#dbe2e5);padding-bottom:15px}.metric:first-child{border-color:#14b8a6}.label{display:block;font-size:12px;color:var(--color-text-secondary,#63747a)}.value{font-size:clamp(22px,4vw,32px);font-weight:600;letter-spacing:-.04em}.unit{font-size:11px;margin-left:4px;color:var(--color-text-secondary,#63747a)}
.lab{display:grid;grid-template-columns:minmax(160px,1fr) minmax(0,1.7fr);gap:24px}.controls{display:grid;align-content:start;gap:20px}label{font-size:13px;display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}output{font-variant-numeric:tabular-nums;font-weight:600}input{width:100%;accent-color:#0d9488;cursor:pointer}button{cursor:pointer;padding:10px 14px;border:0;border-radius:8px;background:#0d9488;color:white;font:inherit;font-size:13px}.canvas{border:1px solid var(--color-border-tertiary,#dbe2e5);border-radius:12px;padding:16px;background:var(--color-background-secondary,#f6f8f8);min-width:0}.canvas-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:10px;margin-bottom:16px}.legend{display:flex;gap:12px;font-size:11px;color:var(--color-text-secondary,#63747a)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#14b8a6;margin-right:4px}.dot.waiting{background:#829397;opacity:.35}svg{display:block;width:100%;height:auto}.caption{border-top:1px solid var(--color-border-tertiary,#dbe2e5);padding-top:12px;margin-top:14px;font-size:12px}footer{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:11px;color:var(--color-text-secondary,#63747a)}
@media(max-width:580px){.lab{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls>button{grid-column:1/-1}header .tag{display:none}footer{align-items:flex-start}.metrics{gap:8px}}
</style></head>
<body>
<header><div><span class="eyebrow">FLOW LAB / INTERACTIVE EXPLANATION</span><h1>把瓶颈，变成看得见的变化。</h1><p>拖动两个参数，观察同一批任务如何穿过系统。</p></div><span class="tag">24 个任务 · 简化模型</span></header>
<section class="metrics" aria-live="polite"><div class="metric"><span class="label">理论吞吐</span><span class="value" id="throughput">16.7</span><span class="unit">任务 / 秒</span></div><div class="metric"><span class="label">整批完成</span><span class="value" id="duration">1.44</span><span class="unit">秒</span></div><div class="metric"><span class="label">等待中的任务</span><span class="value" id="queued">20</span><span class="unit">个</span></div></section>
<section class="lab"><div class="controls"><div><label for="workers">并行工作者 <output id="workers-value">4</output></label><input id="workers" type="range" min="1" max="12" value="4"></div><div><label for="latency">单任务耗时 <output id="latency-value">240 ms</output></label><input id="latency" type="range" min="80" max="800" step="20" value="240"></div><button type="button" id="counter">运行模拟 · 0</button></div><div class="canvas"><div class="canvas-title"><strong>这一刻的队列</strong><div class="legend"><span><i class="dot"></i>执行中</span><span><i class="dot waiting"></i>等待</span></div></div><svg id="queue" viewBox="0 0 360 100" role="img" aria-label="任务队列"></svg><p class="caption" id="explanation">4 个任务同时执行，其余 20 个等待下一批。</p></div></section>
<footer><span id="mode">Ready</span><span>用于理解因果关系，不代表真实硬件性能。</span></footer>
<script>
const workers=document.getElementById('workers'),latency=document.getElementById('latency'),queue=document.getElementById('queue');
for(let i=0;i<24;i++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',String((i%12)*30+2));r.setAttribute('y',String(Math.floor(i/12)*46+4));r.setAttribute('width','24');r.setAttribute('height','34');r.setAttribute('rx','5');queue.appendChild(r)}
function draw(){const w=Number(workers.value),ms=Number(latency.value);document.getElementById('workers-value').textContent=w;document.getElementById('latency-value').textContent=ms+' ms';document.getElementById('throughput').textContent=(w*1000/ms).toFixed(1);document.getElementById('duration').textContent=(Math.ceil(24/w)*ms/1000).toFixed(2);document.getElementById('queued').textContent=24-w;document.getElementById('explanation').textContent=w+' 个任务同时执行，其余 '+(24-w)+' 个等待下一批。';queue.setAttribute('aria-label',w+' 个执行中，'+(24-w)+' 个等待');[...queue.children].forEach((r,i)=>{r.setAttribute('fill',i<w?'#14b8a6':'#829397');r.setAttribute('fill-opacity',i<w?'1':'.22')})}
workers.addEventListener('input',draw);latency.addEventListener('input',draw);let count=0;document.getElementById('counter').onclick=()=>{document.getElementById('counter').textContent='运行模拟 · '+(++count);draw()};draw();
</script></body></html>
