<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Harness</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%2316736B' /%3E%3Cg transform='translate(8 8) scale(0.66667)' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z' /%3E%3Cpath d='M20 3v4' /%3E%3Cpath d='M22 5h-4' /%3E%3Cpath d='M4 17v2' /%3E%3Cpath d='M5 18H3' /%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // 在首帧前落主题，避免刷新时白闪。
      try {
        var saved = localStorage.getItem('harness.ui-theme')
        var dark = saved === 'dark' || saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var size = Number(localStorage.getItem('harness.ui-font-size'))
        if (size >= 10 && size <= 22) document.documentElement.style.fontSize = Math.round(size) + 'px'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
