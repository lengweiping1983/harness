name: Desktop regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test]"
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop test
