name: Pull request policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    # Dependabot 使用自动生成的正文，直接跳过整个作业，避免为每个依赖 PR 启动一次 runner。
    # required check 允许 skipped 状态，因此不阻塞这些 PR 在 CI 通过后合并。
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 只读取元数据，禁止 checkout 或执行 PR 分支代码。
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.user.login === 'dependabot[bot]') {
              core.info('Dependabot dependency updates use their generated description.');
              return;
            }
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const refs = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#([1-9]\d*)\b/gi)];
            if (!refs.length) {
              core.setFailed('PR 正文必须通过 Closes #123 关联本仓库 Issue。');
              return;
            }
            for (const number of new Set(refs.map(match => Number(match[1])))) {
              const {data: issue} = await github.rest.issues.get({...context.repo, issue_number: number});
              if (issue.pull_request) {
                core.setFailed(`#${number} 是 PR，请关联实际 Issue。`);
                return;
              }
            }
            for (const heading of ['变更与验收', '验证证据', '风险与回退']) {
              const section = body.split(`## ${heading}`)[1]?.split(/\n## /)[0]?.trim();
              if (!section || section.length < 10) {
                core.setFailed(`请填写「${heading}」，包含实际证据。`);
              }
            }
