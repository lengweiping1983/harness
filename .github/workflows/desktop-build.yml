name: Desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            voice_binary: hex
            certificate: DESKTOP_MAC_CSC_LINK
            password: DESKTOP_MAC_CSC_KEY_PASSWORD
          - os: macos-15-intel
            arch: x64
            voice_binary: hex
            certificate: DESKTOP_MAC_CSC_LINK
            password: DESKTOP_MAC_CSC_KEY_PASSWORD
          - os: windows-latest
            arch: x64
            voice_binary: hex.exe
            certificate: DESKTOP_WINDOWS_CSC_LINK
            password: DESKTOP_WINDOWS_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: npm --prefix model-runtime ci
      - run: npm --prefix web ci
      - run: npm --prefix desktop ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix desktop test
      - name: Build the bundled voice engine
        working-directory: vendor/hex
        run: cargo build --locked --release --target-dir ../../.run/hex-target
      - name: Build bundled runtime and installers
        run: npm --prefix desktop run package -- --${{ matrix.arch }}
        env:
          HARNESS_UPDATE_REPOSITORY: ${{ vars.HARNESS_UPDATE_REPOSITORY }}
          HARNESS_UPDATE_URL: ${{ vars.HARNESS_UPDATE_URL }}
          HARNESS_RELEASE_BUILD: '1'
          HARNESS_HEX_BINARY: ${{ github.workspace }}/.run/hex-target/release/${{ matrix.voice_binary }}
          CSC_LINK: ${{ secrets[matrix.certificate] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.password] }}
          APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Harness-${{ runner.os }}-${{ matrix.arch }}
          path: |
            .run/installers/*.dmg
            .run/installers/*.zip
            .run/installers/*.exe
            .run/installers/*.blockmap
            .run/installers/latest*.yml
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix desktop ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: Harness-*
          path: .run/artifacts
      - run: node desktop/release-assets.mjs .run/artifacts .run/release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: Harness-release-assets
          path: .run/release-assets/*
          if-no-files-found: error
          retention-days: 14
